[build]
  command = "cd frontend && npm install && npm run build && node -e \"const fs=require('fs');if(fs.existsSync('../docs/index.html')){fs.copyFileSync('../docs/index.html','../docs/404.html');fs.writeFileSync('../docs/.nojekyll','');}\""
  publish = "docs"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback for React Router (Prevents 404 on page refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

