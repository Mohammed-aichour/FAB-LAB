services:
  - type: web
    name: fablab-gmao-backend
    env: node
    rootDir: Anti/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_ORIGIN
        value: https://mohammed-aichour.github.io
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
